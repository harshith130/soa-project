spring.application.name=auth-service

server.port=${PORT:8082}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${server.port}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=443
eureka.instance.home-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/
eureka.instance.status-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/info
eureka.instance.health-check-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/health

# User Service - Use Eureka service discovery (load-balanced RestClient) or explicit public URL
user-service.url=${USER_SERVICE_URL:http://user-service}

# Actuator
management.endpoints.web.exposure.include=health,info