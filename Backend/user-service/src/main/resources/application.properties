spring.application.name=user-service

server.port=${PORT:8081}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stagefront_user_db}}}}
spring.datasource.username=${DB_USER:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:545360}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

user-service.migration.email=${USER_SERVICE_MIGRATION_EMAIL:}
user-service.migration.password=${USER_SERVICE_MIGRATION_PASSWORD:}
