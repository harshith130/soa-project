spring.application.name=user-service

server.port=${PORT:8081}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${server.port}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=443
eureka.instance.home-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/
eureka.instance.status-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/info
eureka.instance.health-check-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/health

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:stagefront_user_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:545360}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

user-service.migration.email=${USER_SERVICE_MIGRATION_EMAIL:}
user-service.migration.password=${USER_SERVICE_MIGRATION_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info
