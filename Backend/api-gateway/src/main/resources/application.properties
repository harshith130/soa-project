spring.application.name=api-gateway

server.port=${PORT:8080}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${server.port}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=443
eureka.instance.home-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/
eureka.instance.status-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/info
eureka.instance.health-check-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/health

# Discovery locator is enabled for future services; required routes are explicit in GatewayRoutesConfig.
spring.cloud.gateway.discovery.locator.enabled=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
