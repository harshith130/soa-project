spring.application.name=api-gateway

server.port=${PORT:8080}

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_SERVER_URL:localhost:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Discovery locator is enabled for future services; required routes are explicit in GatewayRoutesConfig.
spring.cloud.gateway.discovery.locator.enabled=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
