spring.application.name=booking-service

server.port=${PORT:8084}

eureka.client.service-url.defaultZone=http://${EUREKA_SERVER_URL:localhost:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

# Automatic Seat/Booking Hold Expiration Configuration
stagefront.booking.hold-expiration-seconds=60
stagefront.booking.cleanup-interval-ms=5000