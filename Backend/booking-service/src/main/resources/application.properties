spring.application.name=booking-service

server.port=${PORT:8084}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.ip-address=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${EUREKA_PORT:${server.port}}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_PORT:443}
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${eureka.instance.secure-port}
eureka.instance.home-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/
eureka.instance.status-page-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/info
eureka.instance.health-check-url=${RENDER_EXTERNAL_URL:http://localhost:${server.port}}/actuator/health

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:stagefront_booking_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:545360}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

# Automatic Seat/Booking Hold Expiration Configuration
stagefront.booking.hold-expiration-seconds=60
stagefront.booking.cleanup-interval-ms=5000