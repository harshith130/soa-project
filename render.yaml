services:

  # Eureka Server
  - type: web
    name: stagefront-eureka
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/eureka-server/Dockerfile
    dockerContext: ./Backend/eureka-server
    healthCheckPath: /eureka/apps
    envVars:
      - key: PORT
        value: 10000

  # User Service
  - type: web
    name: stagefront-user-service
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/user-service/Dockerfile
    dockerContext: ./Backend/user-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_SERVER_URL
        fromService:
          type: web
          name: stagefront-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: stagefront-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: stagefront-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: stagefront-db
          property: password

  # Auth Service
  - type: web
    name: stagefront-auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/auth-service/Dockerfile
    dockerContext: ./Backend/auth-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_SERVER_URL
        fromService:
          type: web
          name: stagefront-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: stagefront-user-service
          envVarKey: RENDER_EXTERNAL_URL

  # Event Service
  - type: web
    name: stagefront-event-service
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/event-service/Dockerfile
    dockerContext: ./Backend/event-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_SERVER_URL
        fromService:
          type: web
          name: stagefront-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: stagefront-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: stagefront-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: stagefront-db
          property: password

  # Booking Service
  - type: web
    name: stagefront-booking-service
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/booking-service/Dockerfile
    dockerContext: ./Backend/booking-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_SERVER_URL
        fromService:
          type: web
          name: stagefront-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: stagefront-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: stagefront-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: stagefront-db
          property: password

  # API Gateway
  - type: web
    name: stagefront-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/api-gateway/Dockerfile
    dockerContext: ./Backend/api-gateway
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: EUREKA_SERVER_URL
        fromService:
          type: web
          name: stagefront-eureka
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://PLACEHOLDER_VERCEL_DOMAIN

databases:

  - name: stagefront-db
    plan: free